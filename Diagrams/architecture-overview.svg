<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850"><rect width="1100" height="850" fill="#fff"/><defs><marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#333" stroke-width="1.8"/></marker></defs><text x="60" y="52" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700"  fill="#1a1a1a" text-anchor="start">UAA Campus Navigator — Architecture Overview</text><text x="60" y="84" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#555" text-anchor="start">Our solution to guide students through the University campus without the need of a GPS</text><rect x="620" y="125" width="420" height="110" fill="#f3f3f3" stroke="#777" stroke-width="2"/><text x="830" y="155" font-family="Arial, Helvetica, sans-serif" font-size="16"  font-style="italic" fill="#555" text-anchor="middle">«external system»</text><text x="830" y="185" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"  fill="#1a1a1a" text-anchor="middle">OpenStreetMap</text><text x="830" y="215" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#1a1a1a" text-anchor="middle">Outdoor walkways and roads</text><rect x="60" y="300" width="420" height="200" fill="#e8f0fb" stroke="#2f6db5" stroke-width="2"/><rect x="446" y="310" width="24" height="28" fill="#fff" stroke="#2f6db5" stroke-width="1.6"/><rect x="439" y="315" width="14" height="7" fill="#fff" stroke="#2f6db5" stroke-width="1.6"/><rect x="439" y="326" width="14" height="7" fill="#fff" stroke="#2f6db5" stroke-width="1.6"/><text x="270" y="330" font-family="Arial, Helvetica, sans-serif" font-size="16"  font-style="italic" fill="#555" text-anchor="middle">«subsystem»</text><text x="270" y="360" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"  fill="#1a1a1a" text-anchor="middle">Data Extraction</text><text x="270" y="390" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#555" text-anchor="middle">Python · Node.js</text><text x="270" y="426" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#1a1a1a" text-anchor="middle">Turns UAA floor plans into floor JSON</text><text x="270" y="452" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#1a1a1a" text-anchor="middle">157 floors · 50 buildings</text><rect x="620" y="300" width="420" height="200" fill="#eaf6ee" stroke="#2e8b57" stroke-width="2"/><rect x="1006" y="310" width="24" height="28" fill="#fff" stroke="#2e8b57" stroke-width="1.6"/><rect x="999" y="315" width="14" height="7" fill="#fff" stroke="#2e8b57" stroke-width="1.6"/><rect x="999" y="326" width="14" height="7" fill="#fff" stroke="#2e8b57" stroke-width="1.6"/><text x="830" y="330" font-family="Arial, Helvetica, sans-serif" font-size="16"  font-style="italic" fill="#555" text-anchor="middle">«subsystem»</text><text x="830" y="360" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"  fill="#1a1a1a" text-anchor="middle">Build Tools</text><text x="830" y="390" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#555" text-anchor="middle">Node.js · import tool</text><text x="830" y="426" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#1a1a1a" text-anchor="middle">Places floors on the map,</text><text x="830" y="452" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#1a1a1a" text-anchor="middle">builds walking graphs</text><path d="M620 610l16 -16h420v200l-16 16" fill="#fffaf2" stroke="#c07a12" stroke-width="2"/><path d="M1040 610l16 -16" fill="none" stroke="#c07a12" stroke-width="2"/><rect x="620" y="610" width="420" height="200" fill="#fffaf2" stroke="#c07a12" stroke-width="2"/><text x="830" y="640" font-family="Arial, Helvetica, sans-serif" font-size="16"  font-style="italic" fill="#555" text-anchor="middle">«execution environment»</text><text x="830" y="670" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"  fill="#1a1a1a" text-anchor="middle">Web Server</text><text x="830" y="700" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#555" text-anchor="middle">nginx · uaa-campus-map.net</text><text x="830" y="736" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#1a1a1a" text-anchor="middle">Hosts the app and map data:</text><text x="830" y="762" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#1a1a1a" text-anchor="middle">floors, graphs, paths, places</text><path d="M60 610l16 -16h420v200l-16 16" fill="#faf7fe" stroke="#6a4bb0" stroke-width="2"/><path d="M480 610l16 -16" fill="none" stroke="#6a4bb0" stroke-width="2"/><rect x="60" y="610" width="420" height="200" fill="#faf7fe" stroke="#6a4bb0" stroke-width="2"/><text x="270" y="640" font-family="Arial, Helvetica, sans-serif" font-size="16"  font-style="italic" fill="#555" text-anchor="middle">«device»</text><text x="270" y="670" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"  fill="#1a1a1a" text-anchor="middle">User Device</text><text x="270" y="700" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#555" text-anchor="middle">Phone web browser</text><text x="270" y="736" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#1a1a1a" text-anchor="middle">Map, search and routing</text><text x="270" y="762" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#1a1a1a" text-anchor="middle">Positioning from step counting</text><text x="270" y="788" font-family="Arial, Helvetica, sans-serif" font-size="17"   fill="#1a1a1a" text-anchor="middle">and compass</text><path d="M830 235V300" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open)"/><text x="842" y="273" font-family="Arial, Helvetica, sans-serif" font-size="16"  font-style="italic" fill="#555" text-anchor="start">paths</text><path d="M480 410H620" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open)"/><text x="550" y="398" font-family="Arial, Helvetica, sans-serif" font-size="16"  font-style="italic" fill="#555" text-anchor="middle">floor JSON</text><path d="M830 500V594" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open)"/><text x="842" y="552" font-family="Arial, Helvetica, sans-serif" font-size="16"  font-style="italic" fill="#555" text-anchor="start">deploy</text><path d="M620 720H496" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open)"/><text x="558" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16"  font-style="italic" fill="#555" text-anchor="middle">HTTPS</text></svg>